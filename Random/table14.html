<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
        <style>
            table{
                border-collapse: collapse;
            }
            tr,td{
                border: 1px solid black;
            }
            td{
                width: 80px;
                text-align: center;
                height: 40px;
            }
        </style>
    </head>
    <body>
        <table cellspacing="5">
            <tr>
                <td>A</td>
                <td  colspan="2">B</td>
                <td>C</td>
            </tr>
            <tr>
                <td rowspan="2">D</td>
                <td>E</td>
                <td>F</td>
                <td>G</td>
            </tr>
            <tr>
                <td>H</td>
                <td colspan="2">I</td>
            </tr>
            <tr>
                <td colspan="2">J</td>
                <td colspan="2">K</td>
            </tr>
        </table>
    </body>
</html>
