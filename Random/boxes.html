<!DOCTYPE html>
<html>
<head>
<style>
table,td {
  border: 1px solid black;
  border-collapse: collapse;
}
 td {
  width: 60px;  
  padding: 15px;
  text-align: center;
}
</style>
</head>
<body>

<table>
  <tr>
    <td colspan="5">A</td>
  </tr>

  <tr>
    <td rowspan="2">B</td>
    <td colspan="3">C</td>

  </tr>

  <tr>
    <td>D</td>
    <td>E</td>
    <td>F</td>
  </tr>

  <tr>
    <td >G</td>
    <td>H</td>
    <td colspan="2">I</td>
  </tr>
</table>

</body>
</html>
